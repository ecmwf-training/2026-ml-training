# Variables of the training-course toy dataset aifs-ea-an-oper-0001-mars-o48-2010-2022-6h-v1-toy
# (8 prognostic variables, 2 diagnostic variables, 13 forcings). Used at both O48 and O96.
format: zarr
# Time frequency requested from dataset
frequency: 6h
# Time step of model (must be multiple of frequency)
timestep: 6h

datasets:
  data: # user-defined name for the dataset
    # features that are not part of the forecast state
    # but are used as forcing to generate the forecast state
    forcing:
      - "cos_latitude"
      - "cos_longitude"
      - "sin_latitude"
      - "sin_longitude"
      - "cos_julian_day"
      - "cos_local_time"
      - "sin_julian_day"
      - "sin_local_time"
      - "insolation"
      - "lsm"
      - "sdor"
      - "slor"
      - "z"
    # features that are only part of the forecast state
    # but are not used as the input to the model
    diagnostic:
      - tp
      - cp
    processors:
      normalizer:
        _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
        config:
          default: "mean-std"
          remap:
            cp: tp
          std:
            - "tp"
            - "cp"
            - "tcw"
          min-max:
          max:
            - "sdor"
            - "slor"
            - "z"
          none:
            - "cos_latitude"
            - "cos_longitude"
            - "sin_latitude"
            - "sin_longitude"
            - "cos_julian_day"
            - "cos_local_time"
            - "sin_julian_day"
            - "sin_local_time"
            - "insolation"
            - "lsm"

# Values set in the code
num_features: null # number of features in the forecast state
