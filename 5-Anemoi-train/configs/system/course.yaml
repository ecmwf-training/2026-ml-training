# Paths and hardware of the training-course server (EWC, a single GPU).
defaults:
  - output: example
  - input: example
  - hardware: example

input:
  # the toy dataset: O48 grid, 6-hourly, 2010-2022, 23 variables
  dataset: /datasets/aifs-ea-an-oper-0001-mars-o48-2010-2022-6h-v1-toy.zarr
  # built from the graph config on first use and saved here
  graph: ${system.output.root}/graphs/graph_${data.resolution}.pt
  # smoothing matrices of the multi-scale CRPS loss, relative to the folder you start the training from
  loss_matrices_path: loss_matrices

output:
  # checkpoints, plots and MLflow logs end up here
  root: ${oc.env:HOME}/anemoi-output/

# One node with one GPU. The model is not split across GPUs (num_gpus_per_model) and all members of an
# ensemble live on that GPU (num_gpus_per_ensemble), so the ensemble size is training.ensemble_size_per_device.
# With one GPU there is no data parallelism either: the effective batch size is dataloader.batch_size.training
# and the effective learning rate is training.lr.rate.
hardware:
  accelerator: auto
  num_nodes: 1
  num_gpus_per_node: 1
  num_gpus_per_model: 1
  num_gpus_per_ensemble: 1
